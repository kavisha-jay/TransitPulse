[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transitpulse"
version = "0.1.0"
description = "Real-Time & Batch Public Transit Data Lakehouse & Analytics Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "TransitPulse Engineering Team" }
]
dependencies = [
    "pyspark>=3.5.0",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.34.0",
    "pytest>=8.0.0",
    "dbt-postgres>=1.7.0",
    "delta-spark>=3.1.0",
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=4.25.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "duckdb>=0.10.0",
    "dbt-core>=1.7.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
